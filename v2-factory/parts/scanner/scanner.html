}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;

}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}

.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}

.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}

.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}

.iso-line[data-dashed]{stroke-dasharray:3 3}

.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}

.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}

.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}

  };
  const sheet = (tone, levels) => {
    levels[0].groups.get(tone).forEach((arc, index) => {
      const chain = [arc];
      for (let k = 1; k < levels.length; k++) chain.push(align(chain[k - 1], levels[k].groups.get(tone)[index]));
      const last = levels.length - 1;
      const points = [...arcPoints(levels[0].i, levels[0].u, chain[0].from, chain[0].to)];
      for (let k = 1; k < last; k++) points.push(pointAt(levels[k].i, levels[k].u, chain[k].to));
      points.push(...arcPoints(levels[last].i, levels[last].u, chain[last].from, chain[last].to).reverse());
      for (let k = last - 1; k >= 1; k--) points.push(pointAt(levels[k].i, levels[k].u, chain[k].from));
      buckets[tone].push(pathOf(oriented(points), true));
    });
  };
  const overlap = (x, y) => Math.min(x.to, y.to) - Math.max(x.from, y.from);
  const strip = (tone, a, b) => {
    const below = a.groups.get(tone) ?? [];
    const above = (b.groups.get(tone) ?? []).map((arc) => ({ arc, used: false }));
    const quad = (lo, hi) => {
      const points = [...arcPoints(a.i, a.u, lo.from, lo.to), ...arcPoints(b.i, b.u, hi.from, hi.to).reverse()];
      buckets[tone].push(pathOf(oriented(points), true));
    };
    for (const arc of below) {
      let best = null;
      let score = -Infinity;
      for (const entry of above) {
        if (entry.used) continue;
        const aligned = align(arc, entry.arc);
        const value = overlap(arc, aligned);
        if (value > score) (score = value), (best = entry);
      }
      if (best && score > -0.05) {
        best.used = true;
        quad(arc, align(arc, best.arc));
      } else {
        const centre = (arc.from + arc.to) / 2;
        quad(arc, { from: centre, to: centre });
      }
    }
    for (const entry of above) {
      if (entry.used) continue;
      const centre = (entry.arc.from + entry.arc.to) / 2;
      quad({ from: centre, to: centre }, entry.arc);
    }
  };
  const k = scaleOf(P);
  let run = [];
  const flush = () => {
    const tones = [...new Set(run.flatMap((level) => [...level.groups.keys()]))].sort((x, y) => x - y);
    for (const tone of tones) {
      const countOf = (level) => (level.groups.get(tone) ?? []).length;
      let start = 0;
      for (let at = 1; at <= run.length; at++) {
        if (at < run.length && countOf(run[at - 1]) === countOf(run[at])) continue;
        if (at - 1 > start && countOf(run[start])) sheet(tone, run.slice(start, at));
        if (at < run.length) strip(tone, run[at - 1], run[at]);
        start = at;
      }
    }
    run = [];
  };
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    if (Math.abs(ds) < 1e-9) {
      flush();
      continue;
    }
    const count = Math.max(1, rows);
    const reach = (Math.hypot(ds, meridian[i + 1][1] - meridian[i][1]) * k) / count;
    const limit = Math.max(1, Math.min(deepest, Math.ceil(Math.log2(Math.max(2, reach / fineness)))));
    const coarse = Array.from({ length: count + 1 }, (_, index) => levelOf(i, index / count));
    run.push(coarse[0]);
    const refine = (a, b, depth) => {
      const mid = levelOf(i, (a.u + b.u) / 2);
      const split = depth < limit && (!same(a, b) || !same(a, mid) || (depth < 6 && strayOf(i, a, mid, b) > error));
      if (!split) {
        run.push(b);
        return;
      }
      refine(a, mid, depth + 1);
      refine(mid, b, depth + 1);
    };
    for (let index = 1; index <= count; index++) refine(coarse[index - 1], coarse[index], 0);
  }
  flush();
  return buckets;
}

function sideOf(meridian) {
  const m = meridian.length;
  let first = 0;
  let last = m - 1;
  if (meridian[0][1] <= 1e-9) first = 1;
  if (meridian[m - 1][1] <= 1e-9) last = m - 2;
  const side = meridian.slice(first, last + 1);
  for (let index = 1; index < side.length; index++) if (side[index][0] - side[index - 1][0] <= 1e-9) return null;
  return side.length >= 3 ? side : null;
}

function surfaceOf(side, F, P, rims, { samples = 96, slope = null } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const facing = Math.atan2(dot3(F.v, V), dot3(F.u, V));
  const [left, right] = silhouettePoints(side, F, P, { samples, slope });
  if (left.length <= samples || right.length <= samples) return null;
  const s0 = side[0][0];
  const s1 = side[side.length - 1][0];
  const angleOf = (point) => angleToward(F, sub3(point, add3(F.o, mul3(F.a, dot3(sub3(point, F.o), F.a)))));
  const wrap = (angle) => ((angle % TAU) + TAU) % TAU;
  const arc = (s, r, from, to, through) => {
    let sweep = wrap(to - from);
    if (wrap(through - from) > sweep) sweep -= TAU;
    const count = Math.max(4, Math.ceil(Math.abs(sweep) / (TAU / 96)), Math.ceil((Math.abs(sweep) * r * scaleOf(P)) / 1.5));
    return Array.from({ length: count + 1 }, (_, index) => iso(pointOf(F, s, r, from + (sweep * index) / count), P));
  };
  const r0 = side[0][1];
  const r1 = side[side.length - 1][1];
  const bottom = -aV > 0 ? facing + Math.PI : facing;
  const top = aV > 0 ? facing + Math.PI : facing;
  const L = left.map((point) => iso(point, P));
  const R = right.map((point) => iso(point, P));
  const topArc = arc(s1, r1, angleOf(left[left.length - 1]), angleOf(right[right.length - 1]), top);
  const bottomArc = arc(s0, r0, angleOf(right[0]), angleOf(left[0]), bottom);
  const keepFirst = rims === "all" || rims === "first" || rims === "ends";
  const keepLast = rims === "all" || rims === "last" || rims === "ends";
  const fill = pathOf([...L, ...topArc, ...[...R].reverse(), ...bottomArc], true);
  const outline = [pathOf(L), pathOf(R), keepLast ? pathOf(topArc) : "", keepFirst ? pathOf(bottomArc) : ""].join("");
  const hull = hullOf([...arc(s0, r0, 0, TAU - 1e-6, Math.PI), ...arc(s1, r1, 0, TAU - 1e-6, Math.PI), ...L, ...R]);
  let gap = 0;
  for (const p of [...L, ...R]) {
    let best = Infinity;
    for (let index = 0; index < hull.length; index++) {
      const a = hull[index];
      const b = hull[(index + 1) % hull.length];
      const dx = b[0] - a[0];
      const dy = b[1] - a[1];
      const t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / (dx * dx + dy * dy || 1)));
      best = Math.min(best, Math.hypot(p[0] - a[0] - dx * t, p[1] - a[1] - dy * t));
    }
    gap = Math.max(gap, best);
  }
  return { fill, outline, gap };
}

const softOf = (meridian) => meridian.some((point) => Boolean(point[2]));

function lathe(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, bevel = 0, rims = "all", smooth: asked = "auto", waist = 0.5 } = {}) {
  const smooth = asked === "auto" ? softOf(meridian) : asked;
  const V = viewOf(P);
  const L = lightOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const aL = dot3(F.a, L);
  const uL = dot3(F.u, L);
  const vL = dot3(F.v, L);
  const n = steps;
  const m = meridian.length;
  const rings = meridian.map(([s, r]) => Array.from({ length: n }, (_, j) => iso(pointOf(F, s, r, (j / n) * TAU), P)));
  const midC = [];
  const midS = [];
  for (let j = 0; j < n; j++) {
    const t = ((j + 0.5) / n) * TAU;
    midC.push(Math.cos(t));
    midS.push(Math.sin(t));
  }
  const seen = [];
  const tones = [];
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    const length = Math.hypot(ds, dr);
    const row = [];
    const toneRow = [];
    for (let j = 0; j < n; j++) {
      if (length < 1e-9) {
        row.push(false);
        toneRow.push(0);
        continue;
      }
      const facing = ds * (midC[j] * uV + midS[j] * vV) - dr * aV;
      const lit = (ds * (midC[j] * uL + midS[j] * vL) - dr * aL) / length;
      row.push(facing > 1e-6 * length);
      toneRow.push(bandOf(lit));
    }
    seen.push(row);
    tones.push(toneRow);
  }
  const buckets = [[], [], [], [], []];
  const all = [];
  const smoothed = smooth ? smoothRows(meridian, F, P, { steps, ...(smooth === true ? {} : smooth) }) : null;
  if (smoothed) smoothed.forEach((list, tone) => list.forEach((d) => (buckets[tone].push(d), all.push(d))));
  for (let i = 0; i < m - 1; i++) {
    if (smoothed && Math.abs(meridian[i + 1][0] - meridian[i][0]) > 1e-9) continue;
    const keys = seen[i].map((visible, j) => (visible ? tones[i][j] : null));
    for (const { key, run } of groupsOf(keys)) {
      const a = run.map((j) => rings[i][j]);
      const b = run.map((j) => rings[i + 1][j]).reverse();
      const d = pathOf(oriented([...a, ...b]), true);
      buckets[key].push(d);
      all.push(d);
    }
  }
  const phi = Math.atan2(vV, uV);
  const flatV = Math.hypot(uV, vV);
  const rangeOf = (i) => {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    if (Math.hypot(ds, dr) < 1e-9) return null;
    if (Math.abs(ds) < 1e-9 || flatV < 1e-9) return -dr * aV > 1e-9 ? [-1, 1] : null;
    const c = (dr * aV) / (ds * flatV);
    return ds > 0 ? [Math.max(-1, c), 1] : [-1, Math.min(1, c)];
  };
  const arcsOf = (ranges) => {
    if (ranges.some((range) => !range)) return [];
    const lo = Math.max(...ranges.map(([x]) => x));
    const hi = Math.min(...ranges.map(([, x]) => x));
    if (lo >= hi - 1e-9) return [];
    const near = Math.acos(Math.min(1, hi));
    const far = Math.acos(Math.max(-1, lo));
    if (hi >= 1 && lo <= -1) return [[phi, phi + TAU]];
    if (hi >= 1) return [[phi - far, phi + far]];
    if (lo <= -1) return [[phi + near, phi + TAU - near]];
    return [[phi + near, phi + far], [phi - far, phi - near]];
  };
  const along = (s, r, [from, to]) => {
    const count = Math.max(2, Math.ceil(((to - from) * Math.max(r, 1e-6) * scaleOf(P)) / 1.5));
    return Array.from({ length: count + 1 }, (_, j) => iso(pointOf(F, s, r, from + ((to - from) * j) / count), P));
  };
  const creases = [];
  for (let i = 1; i < m - 1; i++) {
    if (meridian[i][2] || meridian[i][1] <= 1e-9) continue;
    for (const arc of arcsOf([rangeOf(i - 1), rangeOf(i)])) creases.push(pathOf(along(meridian[i][0], meridian[i][1], arc)));
  }
  let bevelPath = "";
  if (bevel > 0 && m > 2) {
    const ends = [];
    if (meridian[0][1] <= 1e-9) ends.push([0, 1, 1]);
    if (meridian[m - 1][1] <= 1e-9) ends.push([m - 2, m - 2, m - 3]);
    for (const [cap, rim, side] of ends) {
      const [s, r] = meridian[rim];
      for (const arc of arcsOf([rangeOf(cap), rangeOf(side)])) {
        const inset = along(s, Math.max(0, r - bevel), arc);
        const edge = along(s, r, arc);
        bevelPath += pathOf([edge[0], ...inset.slice(1, -1), edge[edge.length - 1]]);
      }
    }
  }
  const { fill: fillPath, outline } = outlineOf(meridian, F, P, { steps: n, fill, hole, rims, smooth, waist, all });
  return {
    fill: fillPath,
    outline,
    crease: creases.join(""),
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    bevel: bevelPath || undefined,
    seamless: Boolean(smoothed),
  };
}

function shapeOf(meridian, P, smooth) {
  if (smooth && smooth.radius) {
    const segments = meridian.slice(0, -1).map(([s0], index) => (Math.abs(meridian[index + 1][0] - s0) > 1e-9 ? { radius: smooth.radius, slope: smooth.slope } : null));
    return curved(meridian, P, segments);
  }
  const curves = smooth && !smooth.slope ? curveRuns(meridian) : null;
  return curves && curves.some(Boolean) ? curved(meridian, P, curves) : meridian;
}

function outlineOf(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, rims = "all", smooth: asked = "auto", waist = 0.5, all = null } = {}) {
  const smooth = asked === "auto" ? softOf(meridian) : asked;
  const n = steps;
  let fillPath;
  let outline;
  const shape = shapeOf(meridian, P, smooth);
  const side = fill === "auto" || fill === "surface" ? sideOf(shape) : null;
  const surface = side && !hole ? surfaceOf(side, F, P, rims, { slope: smooth && smooth.slope ? smooth.slope : null }) : null;
  if (surface && (fill === "surface" || surface.gap > waist)) {
    fillPath = surface.fill;
    outline = surface.outline;
  } else if (fill === "hull" || fill === "auto" || fill === "surface") {
    const most = Math.max(...shape.map(([, r]) => r));
    const around = Math.min(320, Math.max(n, Math.ceil((TAU * most * scaleOf(P)) / 1.5)));
    const tagged = [];
    shape.forEach(([s, r], index) => {
      for (let j = 0; j < around; j++) tagged.push({ p: iso(pointOf(F, s, r, (j / around) * TAU), P), ring: index });
    });
    const hull = hullTagged(tagged);
    const holePath = hole ? pathOf(Array.from({ length: around }, (_, j) => iso(pointOf(F, hole[0], hole[1], (j / around) * TAU), P)), true) : "";
    fillPath = pathOf(hull.map(({ p }) => p), true) + holePath;
    if (rims === "all") {
      outline = pathOf(hull.map(({ p }) => p), true) + holePath;
    } else {
      const keepFirst = rims === "first" || rims === "ends";
      const keepLast = rims === "last" || rims === "ends";
      const edges = hull.map((a, index) => {
        const b = hull[(index + 1) % hull.length];
        const same = a.ring === b.ring;
        const keep = !same || (a.ring !== 0 && a.ring !== shape.length - 1) || (keepFirst && a.ring === 0) || (keepLast && a.ring === shape.length - 1);
        return [a.p, b.p, keep];
      });
      outline = chains(edges).map((points) => pathOf(points)).join("") + holePath;
    }
  } else {
    fillPath = all ? all.join("") : (({ shades, top }) => [...shades, top].join(""))(lathe(meridian, F, P, { steps: n, fill: "auto", hole, rims, smooth, waist }));
    outline = "";
  }
  return { fill: fillPath, outline };
}

const signedArea = (points) => points.reduce((sum, [x, y], index) => {
  const [nx, ny] = points[(index + 1) % points.length];
  return sum + x * ny - nx * y;
}, 0);

const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);

const saddleStart = (R, a, angle) => Math.sqrt(Math.max(0, R * R - a * a * Math.cos(angle) ** 2));

function saddleOf(F, a, start, s1, P, { steps = stepsFor(a, 24) } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const n = steps;
  const angle = (j) => (j / n) * TAU;
  const from = typeof start === "function" ? start : (t) => saddleStart(start, a, t);
  const low = Array.from({ length: n }, (_, j) => iso(pointOf(F, from(angle(j)), a, angle(j)), P));
  const high = Array.from({ length: n }, (_, j) => iso(pointOf(F, s1, a, angle(j)), P));
  const seen = [];
  const tones = [];
  for (let j = 0; j < n; j++) {
    const normal = radialOf(F, angle(j + 0.5));
    seen.push(dot3(normal, V) > 1e-6);
    tones.push(bandOf(dot3(normal, L)));
  }
  const buckets = [[], [], [], [], []];
  const fills = [];
  const keys = seen.map((visible, j) => (visible ? tones[j] : null));
  for (const { key, run } of groupsOf(keys)) {
    const d = pathOf(oriented([...run.map((j) => low[j]), ...run.map((j) => high[j]).reverse()]), true);
    buckets[key].push(d);
    fills.push(d);
  }
  const capSeen = dot3(F.a, V) > 1e-6;
  if (capSeen) {
    const d = pathOf(oriented(high), true);
    buckets[bandOf(dot3(F.a, L))].push(d);
    fills.push(d);
  }
  const front = runsOf(seen);
  const back = runsOf(seen.map((visible) => !visible));
  const edges = [];
  for (const run of front) {
    edges.push(pathOf(run.map((j) => low[j])));
    edges.push(pathOf([low[run[0]], high[run[0]]]), pathOf([low[run[run.length - 1]], high[run[run.length - 1]]]));
  }
  for (const run of capSeen ? back : front) edges.push(pathOf(run.map((j) => high[j])));
  return {
    fill: fills.join(""),
    outline: edges.join(""),
    crease: capSeen ? front.map((run) => pathOf(run.map((j) => high[j]))).join("") : "",
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    seamless: true,
  };
}

function prismOf(F, polygon, s0, s1, P) {
  const V = viewOf(P);
  const L = lightOf(P);
  const ring = oriented(polygon.map(([x, y]) => [x, y]));
  const n = ring.length;
  const at = (s, [x, y]) => [F.o[0] + F.a[0] * s + F.u[0] * x + F.v[0] * y, F.o[1] + F.a[1] * s + F.u[1] * x + F.v[1] * y, F.o[2] + F.a[2] * s + F.u[2] * x + F.v[2] * y];
  const low = ring.map((point) => iso(at(s0, point), P));
  const high = ring.map((point) => iso(at(s1, point), P));
  const buckets = [[], [], [], [], []];
  const seen = [];
  for (let j = 0; j < n; j++) {
    const [x0, y0] = ring[j];
    const [x1, y1] = ring[(j + 1) % n];
    const normal = unit3(add3(mul3(F.u, y1 - y0), mul3(F.v, -(x1 - x0))));
    const visible = dot3(normal, V) > 1e-6;
    seen.push(visible);
    if (visible) buckets[bandOf(dot3(normal, L))].push(pathOf([low[j], low[(j + 1) % n], high[(j + 1) % n], high[j]], true));
  }
  const ends = [[s0, low, mul3(F.a, -1)], [s1, high, F.a]];
  const capSeen = ends.map(([, , normal]) => dot3(normal, V) > 1e-6);
  ends.forEach(([, points, normal], index) => capSeen[index] && buckets[bandOf(dot3(normal, L))].push(pathOf(points, true)));
  const hull = hullOf([...low, ...high]);
  const creases = [];
  for (let j = 0; j < n; j++) {
    const prev = (j - 1 + n) % n;
    const a = [ring[j][0] - ring[prev][0], ring[j][1] - ring[prev][1]];
    const b = [ring[(j + 1) % n][0] - ring[j][0], ring[(j + 1) % n][1] - ring[j][1]];
    const sharp = (a[0] * b[0] + a[1] * b[1]) / (Math.hypot(a[0], a[1]) * Math.hypot(b[0], b[1]) || 1) < Math.cos(0.35);
    if (sharp && seen[j] && seen[prev]) creases.push(pathOf([low[j], high[j]]));
    ends.forEach(([, points], index) => capSeen[index] && seen[j] && creases.push(pathOf([points[j], points[(j + 1) % n]])));
  }
  return { fill: pathOf(hull, true), outline: pathOf(hull, true), crease: creases.join(""), top: buckets[4].join(""), shades: buckets.slice(0, 4).map((list) => list.join("")) };
}

function stadium(r0, r1, offset, steps = 32) {
  const circle = (cx, r) => Array.from({ length: steps }, (_, index) => [cx + r * Math.cos((index / steps) * TAU), r * Math.sin((index / steps) * TAU)]);
  return hullOf([...circle(0, r0), ...circle(offset, r1)]);
}

function sphereOf(centre, r, P, { steps = 48 } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const F = frameAlong(centre, V);
  const flat = (p) => iso(p, P);
  const rim = Array.from({ length: steps }, (_, index) => pointOf(F, 0, r, (index / steps) * TAU));
  const outline = pathOf(rim.map(flat), true);
  const capOf = (threshold) => {
    const points = rim.filter((p) => dot3(sub3(p, centre), L) / r >= threshold).map(flat);
    const c = dot3(L, V);
    const LF = frameAlong(add3(centre, mul3(L, r * threshold)), L);
    const radius = r * Math.sqrt(Math.max(0, 1 - threshold * threshold));
    for (let index = 0; index < steps; index++) {
      const p = pointOf(LF, 0, radius, (index / steps) * TAU);
      if (dot3(sub3(p, centre), V) >= -1e-9) points.push(flat(p));
    }
    if (c > threshold) points.push(flat(add3(centre, mul3(V, r))));
    return points.length > 2 ? pathOf(hullOf(points), true) : "";
  };
  const shades = [outline, capOf(BANDS[1]), capOf(BANDS[2]), capOf(BANDS[3])];
  return { fill: outline, outline, crease: "", top: "", shades, seamless: true };
}

const disc = (s0, s1, r, F, P, options = {}) =>
  lathe(
    [
      [s0, 0],
      [s0, r],
      [s1, r],
      [s1, 0],
    ],
    F,
    P,
    { steps: stepsFor(r, 32, 160, scaleOf(P)), ...options },
  );

const ringBand = (s0, s1, rIn, rOut, F, P, options = {}) =>
  lathe(
    [
      [s0, rIn],
      [s0, rOut],
      [s1, rOut],
      [s1, rIn],
    ],
    F,
    P,
    { steps: stepsFor(rOut, 32, 160, scaleOf(P)), hole: null, ...options },
  );

function solidOf(profile, F, P, options = {}) {
  const first = profile[0];

// A parcel handed on mid-fall may carry item.v (its world velocity, units/s): the fall starts with exactly that
// velocity, then bends (in a quadratic) to land on the target, which may be moving.
const CONVEYOR_G = 420; // world units / s², the fall

  for (let d = 0; d < 3; d++) {
    const g = d === 2 ? CONVEYOR_G : 0;
    const free = f.from[d] + f.v[d] * t - 0.5 * g * t * t;
    const freeEnd = f.from[d] + f.v[d] * T - 0.5 * g * T * T;
    out[d] = free + (to[d] - freeEnd) * tt * tt;

  const F = CONVEYOR.frame(D);
  const B = CONVEYOR.path(D);
  const g = { slats: api.slot("slats"), top: api.slot("top"), w0: api.slot("wrap0"), w1: api.slot("wrap1"), ws0: api.slot("wrapSlats0"), ws1: api.slot("wrapSlats1"), bottom: api.slot("bottom"), bs: api.slot("bottomSlats") };
  const nCleats = D.nCleats;
  const cleatGap = D.cleatGap;
  const { CH, HOOK, PK } = D;
  const items = [];
  const bails = []; // empty bails folding back after a release
  const taken = new Set();
  let travel = 0;
  let dropped = 0;
  let spent = 0;
  let still = false;
  const uIn = D.dir > 0 ? D.inS : D.L - D.inS;
  const uHeadEnd = D.L + Math.PI * D.RW; // start of the lower run
  const uRead = uHeadEnd + Math.abs(D.readS - B.sHead);
  const cleatU = (kk, tr = travel) => ((kk * cleatGap + tr) % B.total + B.total) % B.total;
  // where something riding cleat kk is, and its axes
  function pose(u, lift) {
    const q = B.at(u);
    const tW = [F.sV[0] * q.ts, F.sV[1] * q.ts, q.tz];
    const nW = [F.sV[0] * q.ns, F.sV[1] * q.ns, q.nz];
    const base = F.w(q.s, 0, q.z);
    return { q, tW, nW, base, at: (h) => [base[0] + nW[0] * (lift + h), base[1] + nW[1] * (lift + h), base[2] + nW[2] * (lift + h)] };
  }
  function planAround(c) {
    const along = 1.6;
    const across = D.W - 1.2;
    return D.axis === "y" ? { x: c[0] - across / 2, y: c[1] - along / 2, w: across, d: along, r: 0.2 } : { x: c[0] - along / 2, y: c[1] - across / 2, w: along, d: across, r: 0.2 };
  }
  function cleatSvg(o) {
    if (o.q.run === "top") return solidSvg(slabOf(planAround(o.base), o.base[2], CH, api.P, 2, 0.2), { tone: "lo" });
    if (o.q.run === "bottom") return solidSvg(slabOf(planAround(o.base), o.base[2] - CH, CH, api.P, 2, 0), { tone: "lo" });
    return CONVEYOR.obbSvg(api, D, o.at(CH / 2), [o.tW, F.cV, o.nW], [0.8, D.W / 2 - 0.6, CH / 2], "lo");
  }
  // a hinged bail: folded flat on the top run, it swings out as the parcel goes under and hangs it HOOK below
  const hookOf = (q) => HOOK * api.smooth(0.05, 0.95, -q.nz);
  const ACROSS = (D.axis === "y" ? PK.w : PK.d) / 2 + 0.45;
  // the bail's two side straps from the cleat ends down to pivots on the parcel's sides; fold (0..1) shortens them
  function strapSvg(o, hook, side, fold = 1) {
    const len = (hook / HOOK) * (HOOK + PK.h / 2) * fold;
    if (len < 0.3) return "";
    const m = o.at(len / 2);
    const c = [m[0] + F.cV[0] * side * ACROSS, m[1] + F.cV[1] * side * ACROSS, m[2]];
    return CONVEYOR.obbSvg(api, D, c, [o.tW, F.cV, o.nW], [0.7, 0.35, len / 2], "lo");
  }
  const HALF = D.axis === "y" ? [PK.d / 2, PK.w / 2, PK.h / 2] : [PK.w / 2, PK.d / 2, PK.h / 2];
  function packetAt(kind, o, alpha, hook) {
    const run = o.q.run;
    let svg;
    if (run === "top") svg = api.packetSvg(kind, o.at(0), PK);
    else if (run === "bottom") { const p = o.at(hook); svg = api.packetSvg(kind, [p[0], p[1], p[2] - PK.h], PK); }
    else svg = CONVEYOR.packetObb(api, D, kind, o.at(hook + PK.h / 2), [o.tW, F.cV, o.nW], HALF, 0.05 * PK.h * o.q.nz);
    return alpha < 1 ? '<g opacity="' + alpha.toFixed(3) + '">' + svg + "</g>" : svg;
  }
  const posOf = (o, hook) => (o.q.run === "bottom" ? o.at(hook).map((v, i) => (i === 2 ? v - PK.h : v)) : o.at(hook));
  // parcels on the top run over the front drum go with the front wrap (drawn after the top run)
  const slotOf = (q) => (q.run === "top" ? (q.s > D.L - 6 ? "w1" : "top") : q.run === "bottom" ? "bottom" : (q.run === "head" ? B.sHead : B.sTail) === 0 ? "w0" : "w1");
  const KINDS = ["control", "graph", "data"];
  // reduced motion: a representative still — parcels on every third cleat, the ones past the read point spent
  function seed() {
    if (items.length) return;
    for (let kk = 0; kk < nCleats; kk += 3) {
      const u = cleatU(kk);
      const spentAlready = u > uRead || u < uIn;
      items.push({ item: { id: -1 - kk, kind: KINDS[(kk / 3) % 3], born: 0 }, kind: KINDS[(kk / 3) % 3], cleat: kk, phase: "ride", lastU: u, spend: spentAlready ? 1 : 0, spending: false });
      taken.add(kk);
    }
  }
  return {
    accept(port, item, from) {
      if (api.calm()) return; // still: nothing arrives
      const to = F.w(D.inS, 0, D.T + CH);
      const start = from ?? D.feedFrom ?? [to[0], to[1], to[2] + 24];
      const fall = conveyorFall(item, start, to);
      // the free cleat that will be nearest the landing point when the item gets there
      let best = -1;
      let bestD = 1e9;
      for (let kk = 0; kk < nCleats; kk++) {
        if (taken.has(kk)) continue;
        const dd = uIn - cleatU(kk, travel + D.speed * fall.dur);
        if (dd > -cleatGap * 0.5 && dd < cleatGap * 2.5 && Math.abs(dd) < bestD) { best = kk; bestD = Math.abs(dd); }
      }
      if (best < 0) { console.warn(D.id ?? "loop", "belt full: parcel refused"); return; }
      taken.add(best);
      items.push({ item, kind: item.kind, cleat: best, phase: "fall", fall, lastU: null, spend: item.kind === "garbage" ? 1 : 0, spending: false, pos: start });
    },
    tick(dt) {
      if (api.calm()) {
        if (still) return;
        still = true;
        seed();
        dt = 0;
      } else still = false;
      travel += D.speed * dt;
      const sl = CONVEYOR.slats(api, D, F, B, travel, D.pitch);
      g.slats.innerHTML = CONVEYOR.line(sl.top, "lo");
      g.ws0.innerHTML = CONVEYOR.line(sl.w0, "lo");
      g.ws1.innerHTML = CONVEYOR.line(sl.w1, "lo");
      g.bs.innerHTML = CONVEYOR.line(sl.bottom, "faint");
      const draw = { top: [], w0: [], w1: [], bottom: [] };
      for (let kk = 0; kk < nCleats; kk++) {
        const o = pose(cleatU(kk), 0);
        draw[slotOf(o.q)].push({ key: CONVEYOR.dot(o.at(CH / 2), api.V), svg: cleatSvg(o) });
      }
      for (let i = bails.length - 1; i >= 0; i--) {
        const b = bails[i];
        b.t += dt / 0.3;
        if (b.t >= 1) { bails.splice(i, 1); continue; }
        const o = pose(cleatU(b.cleat), CH);
        const hook = hookOf(o.q);
        const fold = 1 - api.smooth(0, 1, b.t);
        draw[slotOf(o.q)].push({ key: CONVEYOR.dot(o.at(hook / 2), api.V) + 0.4, svg: strapSvg(o, hook, -1, fold) + strapSvg(o, hook, 1, fold) });
      }
      for (let i = items.length - 1; i >= 0; i--) {
        const it = items[i];
        const u = cleatU(it.cleat);
        const o = pose(u, CH);
        if (it.phase === "fall") {
          it.fall.tau += dt / it.fall.dur;
          const p = conveyorFallAt(it.fall, o.at(0));
          it.pos = p;
          if (it.fall.tau >= 1) { it.phase = "ride"; it.lastU = u; }
          draw.top.push({ key: CONVEYOR.dot([p[0], p[1], p[2] + 3.5], api.V) + 50, svg: api.packetSvg(it.kind, p, PK) });
          continue;
        }
        // station bookkeeping (u only grows, modulo the loop)
        const prev = it.lastU;
        const passed = (mark) => (prev <= u ? prev < mark && u >= mark : prev < mark || u >= mark);
        const hook = hookOf(o.q);
        if (passed(uHeadEnd) && it.spend >= 1 && D.drop) {
          // release at the bottom of the head drum: the parcel leaves with the belt's speed, its bail folds back
          items.splice(i, 1);
          taken.delete(it.cleat);
          bails.push({ cleat: it.cleat, t: 0 });
          dropped++;
          const v = [o.tW[0] * D.speed, o.tW[1] * D.speed, o.tW[2] * D.speed];
          api.emit("drop", { ...it.item, kind: "garbage", was: it.item.kind, v }, posOf(o, hook));
          continue;
        }
        if (D.autoSpend && !it.spending && it.spend < 1 && passed(uRead)) it.spending = true;
        if (it.spending) {
          it.spend = Math.min(1, it.spend + dt / 0.6);
          if (it.spend >= 1) { it.spending = false; spent++; }
        }
        it.lastU = u;
        it.pos = posOf(o, hook);
        const key = CONVEYOR.dot(o.at(hook + PK.h / 2), api.V) + 0.5;
        let svg = packetAt(it.kind, o, 1, hook);
        if (it.spend > 0) svg = it.spend >= 1 ? packetAt("garbage", o, 1, hook) : svg + packetAt("garbage", o, it.spend, hook);
        draw[slotOf(o.q)].push({ key, svg: strapSvg(o, hook, -1) + svg + strapSvg(o, hook, 1) });
      }
      for (const name of ["top", "w0", "w1", "bottom"]) {
        const list = draw[name].sort((a, b) => a.key - b.key);
        g[name].innerHTML = list.map((d) => d.svg).join("");
      }
    },
    // read access for the scanner and centrifuge (FACTORY.machines.<id>)
    items: () => items.map((it) => ({ id: it.item.id, kind: it.spend >= 1 ? "garbage" : it.kind, pos: it.pos ?? F.w(D.inS, 0, D.T), run: it.phase === "fall" ? "air" : B.at(cleatU(it.cleat)).nz >= 0 ? "top" : "bottom" })),
    slatPhase: () => travel / D.pitch,
    // one cleat gap = one render quantum: phase 0 when a cleat is at the read point, rising to 1 as the next arrives
    quanta: () => {
      const rel = (((travel - uRead) % cleatGap) + cleatGap) % cleatGap;
      return {
        phase: rel / cleatGap,
        period: cleatGap / D.speed,
        count: Math.floor((travel - uRead) / cleatGap) + nCleats,
        cleats: Array.from({ length: nCleats }, (_, kk) => { const o = pose(cleatU(kk), 0); return { pos: o.base, run: o.q.nz >= 0 ? "top" : "bottom" }; }),
      };
    },
    geometry: () => CONVEYOR.copy(D),
    // will a free cleat be under the in point for a parcel arriving "after" seconds from now (falling ≈ 0.2 s)?
    // A sender that asks first never has a parcel refused (the centrifuge holds it for another turn instead).
    canTake: (after = 0) => {
      const at = travel + D.speed * (after + 0.2);
      for (let kk = 0; kk < nCleats; kk++) {
        if (taken.has(kk)) continue;
        const dd = uIn - cleatU(kk, at);
        if (dd > -cleatGap * 0.5 && dd < cleatGap * 2.5) return true;
      }
      return false;
    },
    spend: (id) => { const it = items.find((x) => x.item.id === id); if (it && it.spend < 1) it.spending = true; },
    stats: () => ({ riding: items.filter((it) => it.phase === "ride" && B.at(cleatU(it.cleat)).nz > 0).length, hanging: items.filter((it) => B.at(cleatU(it.cleat)).run === "bottom").length, dropped, spent }),
  };
}

MACHINES.conveyor = (api) => (api.data.type === "loop" ? conveyorLoop(api, api.data) : conveyorTop(api, api.data));


MACHINES.scanner = (api) => {
  const D = api.data;
  const P = api.P;
  const g = { coil: api.slot("coil"), arm: api.slot("arm"), lamp: api.slot("lamp"), out: api.slot("out"), buffer: api.slot("buffer") };
  const SEEK = 0.16, SPEED = 140, PER_PACKET = 4;
  const chunks = api.els('[data-route="' + D.cable + '"]').map((el) => {
    const [a, b] = el.dataset.span.split(",").map(Number);
    return { el: el.querySelector(".fx-pulse"), a, b, on: 0 };
  });
  const cableLen = D.cableLen;
  let ribbonLen = 40;
  const [px, py] = D.pivot;
  const [z0, z1] = D.armZ;
  const hx0 = px;
  let head = hx0, lock = null, seekFrom = null, seekAt = -9, readAt = -9;
  const pulses = [];
  const outgoing = [];
  let buffered = 0;
  const levels = [0, 0, 0, 0];
  const self = { reads: 0, packets: 0 };
  const S = (paths, style) => solidSvg(paths, style);
  const pts = (list) => list.map((p) => iso(p, P));
  const poly = (list) => "M" + pts(list).map(([x, y]) => x.toFixed(2) + " " + y.toFixed(2)).join("L") + "Z";

  // the belt being read (opts.belt, default "audio"): one cleat gap = one 128-frame render quantum. Prefers the belt's
  // quanta() (cleat positions), falls back to geometry() + slatPhase() (the conveyor's own path maths), then to slats().
  function cleats() {
    const belt = FACTORY.machines[D.belt];
    if (!belt) return null;
    const g = belt.geometry ? belt.geometry() : null;
    const loop = g ? 2 * g.L + 2 * Math.PI * g.RW : 0;
    const gapOf = () => (g ? (g.cleatGap ?? loop / Math.floor(loop / (g.pitch * g.cleatEvery))) : belt.pitch || 12);
    if (belt.quanta) {
      const q = belt.quanta();
      const xs = q.cleats.filter((c) => c.run === "top").map((c) => c.pos[0]);
      return { xs, gap: gapOf(), dir: g ? g.dir : -1, axis: g ? g.axis : "x" };
    }
    if (g && belt.slatPhase) {
      const gap = gapOf(), sTail = g.dir > 0 ? 0 : g.L, travel = belt.slatPhase() * g.pitch, xs = [];
      for (let i = 0; i < Math.round(loop / gap); i++) {
        const u = (((i * gap + travel) % loop) + loop) % loop;
        if (u < g.L) xs.push(g.origin[0] + sTail + g.dir * u);
      }
      return { xs, gap, dir: g.dir, axis: g.axis };
    }
    if (belt.slats) return { xs: belt.slats(), gap: belt.pitch || 12, dir: -1, axis: "x" };
    return null;
  }
  const nearest = (list, x) => list.reduce((best, v) => (Math.abs(v - x) < Math.abs(best - x) ? v : best), list[0]);

  function armAt(theta) {
    const a = [Math.sin(theta), Math.cos(theta)], c = [Math.cos(theta), -Math.sin(theta)];
    const L = (s, cc) => [px + a[0] * s + c[0] * cc, py + a[1] * s + c[1] * cc];
    const ring = (list) => list.map(([s, cc]) => L(s, cc));
    const atZ = (p, z) => [p[0], p[1], z];
    // coil and fork (drawn under the VCM top plate)
    const coilRing = [180 - 17, 180 + 17].flatMap((d, i) => {
      const r = i ? [16, 9] : [9, 16];
      return r.map((rr) => [px + rr * Math.sin(theta + (d * Math.PI) / 180), py + rr * Math.cos(theta + (d * Math.PI) / 180)]);
    });
    const coilIn = [180 - 9, 180 + 9].flatMap((d, i) => {
      const r = i ? [14, 11] : [11, 14];
      return r.map((rr) => [px + rr * Math.sin(theta + (d * Math.PI) / 180), py + rr * Math.cos(theta + (d * Math.PI) / 180), D.oz + 96.5]);
    });
    const coil = '<g class="it fx-graphite">' + S(extrude(ring([[-3.4, -2.6], [-9.6, -2.2], [-9.6, 2.2], [-3.4, 2.6]]), z0, z1 - z0, P), { tone: "mid" }) + '</g>' +
      '<g class="it">' + S(extrude(coilRing, D.oz + 91, 5.5, P), { tone: "hi", inner: lineSvg(poly(coilIn), { tone: "lo" }) }) + '</g>';
    // arm, slots, trace, load beam, slider, hub and clamp nut
    const slotA = [[7, -1.3], [12, -1.05], [12, 1.05], [7, 1.3]].map(([s, cc]) => atZ(L(s, cc), z1));
    const slotB = [[14, -0.95], [18, -0.75], [18, 0.75], [14, 0.95]].map(([s, cc]) => atZ(L(s, cc), z1));
    const t0 = atZ(L(5, 2.1), z1), t1 = atZ(L(21.5, 0.8), z1);
    const armSvg = S(extrude(ring([[2, -3.6], [23, -1.2], [23, 1.2], [2, 3.6]]), z0, z1 - z0, P), { tone: "hi", inner: lineSvg(poly(slotA) + poly(slotB), { tone: "lo" }) + lineSvg("M" + pts([t0, t1]).map(([x, y]) => x.toFixed(2) + " " + y.toFixed(2)).join("L"), { tone: "faint" }) + dotsSvg(pts([t0, t1]), { size: 0.32, tone: "mid" }) });
    const beam = S(extrude(ring([[22.4, -1.1], [29.6, -0.55], [29.6, 0.55], [22.4, 1.1]]), D.oz + 95.0, 0.4, P), { tone: "mid" });
    const sl = L(D.reach, 0);
    const slider = S(extrude(ring([[D.reach - 0.8, -0.9], [D.reach + 0.8, -0.9], [D.reach + 0.8, 0.9], [D.reach - 0.8, 0.9]]), D.oz + 93.6, 1.4, P), { tone: "hi" });
    const hub = S(cylinder(px, py, 4.2, D.oz + 94, 2.5, P, 28), { tone: "mid" });
    const nut = S(cylinder(px, py, 2.6, D.oz + 96.5, 1.5, P, 6), { tone: "mid" }) + dotsSvg(pts([[px, py, D.oz + 98]]), { size: 0.4 });
    return { coil, arm: '<g class="it">' + armSvg + beam + slider + '</g><g class="it fx-graphite">' + hub + nut + '</g>', attach: [L(1.5, 4.4), a], head: sl };
  }

  // flex ribbon: a vertical strip from the arm's side to the bracket's +y face, as a cubic in plan
  function ribbon(attach, dir) {
    const [A0, a] = [attach, dir];
    const B = D.bracket;
    const P1 = [A0[0] + a[0] * 7, A0[1] + a[1] * 7], P2 = [B[0], B[1] + 7];
    const N = 18;
    const curve = Array.from({ length: N + 1 }, (_, i) => {
      const t = i / N, u = 1 - t;
      return [u * u * u * A0[0] + 3 * u * u * t * P1[0] + 3 * u * t * t * P2[0] + t * t * t * B[0], u * u * u * A0[1] + 3 * u * u * t * P1[1] + 3 * u * t * t * P2[1] + t * t * t * B[1]];
    });
    const lens = [0];
    for (let i = 1; i < curve.length; i++) lens.push(lens[i - 1] + Math.hypot(curve[i][0] - curve[i - 1][0], curve[i][1] - curve[i - 1][1]));
    const [za, zb] = D.flexZ;
    const band = (from, to) => {
      const sel = curve.filter((_, i) => lens[i] >= from && lens[i] <= to);
      if (sel.length < 2) return "";
      return poly([...sel.map((p) => [p[0], p[1], zb]), ...sel.reverse().map((p) => [p[0], p[1], za])]);
    };
    return { curve, total: lens[lens.length - 1], band, shape: band(0, lens[lens.length - 1]) };
  }

  function draw(t) {
    const theta = Math.asin(api.clamp((head - px) / D.reach, -0.6, 0.6));
    const arm = armAt(theta);
    const rb = ribbon(arm.attach[0], arm.attach[1]);
    ribbonLen = rb.total;
    let flex = '<g class="it"><path class="iso-fill" d="' + rb.shape + '"/><path class="iso-shade" data-shade="2" d="' + rb.shape + '"/>';
    for (const p of pulses) {
      const s = (t - p.t0) * SPEED;
      if (s < rb.total + 3) flex += '<path d="' + rb.band(Math.max(0, s - 3), Math.min(rb.total, s + 3)) + '" style="fill:var(--pk-audio-face)"/>';
    }
    flex += '<path class="iso-line iso-edge" data-tone="mid" d="' + rb.shape + '"/></g>';
    g.coil.innerHTML = arm.coil;
    g.arm.innerHTML = flex + arm.arm;
    // pulses along the round cable, chunk by chunk
    for (const c of chunks) {
      let o = 0;
      for (const p of pulses) {
        const s = ((t - p.t0) * SPEED - rb.total) / cableLen;
        const mid = (c.a + c.b) / 2;
        o = Math.max(o, Math.exp(-(((mid - s) / 0.05) ** 2)));
      }
      if (Math.abs(o - c.on) > 0.01) { c.on = o; c.el.style.opacity = (o * 0.9).toFixed(2); }
    }
    // lamp glow
    const age = t - readAt;
    const glow = api.calm() ? 0 : api.smooth(0, 0.05, age) * Math.exp(-Math.max(0, age - 0.05) / 0.16);
    const lc = iso(D.lamp, P);
    g.lamp.innerHTML = glow > 0.02 ? '<circle cx="' + lc[0].toFixed(2) + '" cy="' + lc[1].toFixed(2) + '" r="' + (3.2 * api.KS).toFixed(2) + '" style="fill:var(--pk-audio-top);opacity:' + (glow * 0.6).toFixed(2) + '"/>' : "";
    // buffer window: one cell per quantum read since the last packet
    const W = D.preamp.win, fx = D.preamp.face;
    let cells = "";
    for (let i = 0; i < PER_PACKET; i++) {
      const y0 = W.y0 + 0.5 + i * 1.95, y1 = y0 + 1.45;
      const d = poly([[fx, y0, W.z0 + 0.5], [fx, y1, W.z0 + 0.5], [fx, y1, W.z1 - 0.5], [fx, y0, W.z1 - 0.5]]);
      cells += '<path d="' + d + '" style="fill:var(--anatomy-shade-0)"/>' + (levels[i] > 0.01 ? '<path d="' + d + '" style="fill:var(--pk-audio-top);opacity:' + levels[i].toFixed(2) + '"/>' : "");
    }
    g.buffer.innerHTML = cells;
    // packets pushed out of the preamp's back face onto the lip (drawn behind the box, so the box hides the start)
    g.out.innerHTML = outgoing.map((o) => api.packetSvg("audio", o.p)).join("");
  }

  self.tick = (dt, t) => {
    const calm = api.calm();
    const belt = cleats();
    if (!calm && belt && belt.axis === "x" && belt.xs.length) {
      const list = belt.xs, sgn = belt.dir >= 0 ? 1 : -1;
      lock = lock === null ? nearest(list, hx0 - sgn * D.track) : nearest(list, lock);
      if ((lock - hx0) * sgn > D.track) {
        self.reads++;
        readAt = t;
        pulses.push({ t0: t });
        seekFrom = head;
        seekAt = t;
        lock = nearest(list, lock - sgn * belt.gap);
      }
      const target = api.clamp(lock, hx0 - D.track, hx0 + D.track);
      head = t - seekAt < SEEK && seekFrom !== null ? seekFrom + (target - seekFrom) * api.smooth(0, SEEK, t - seekAt) : target;
    }
    for (let i = 0; i < PER_PACKET; i++) {
      const want = i < buffered ? 1 : 0;
      levels[i] = calm ? want : levels[i] + (want - levels[i]) * (1 - Math.exp(-dt / (want > levels[i] ? 0.05 : 0.1)));
    }
    for (let i = pulses.length - 1; i >= 0; i--) {
      if ((t - pulses[i].t0) * SPEED > ribbonLen + cableLen + 4) {
        pulses.splice(i, 1);
        buffered++;
        if (buffered >= PER_PACKET) {
          buffered = 0;
          outgoing.push({ item: api.item("audio"), t0: t, p: [D.preamp.x, D.preamp.y0 + 4, D.preamp.lipZ] });
        }
      }
    }
    for (let i = outgoing.length - 1; i >= 0; i--) {
      const o = outgoing[i];
      const u = api.smooth(0, 1.1, t - o.t0);
      o.p = [D.preamp.x, D.preamp.y0 + 4 + (D.preamp.outY - D.preamp.y0 - 4) * u, D.preamp.lipZ];
      if (u >= 1) {
        outgoing.splice(i, 1);
        self.packets++;
        api.emit("out", o.item, o.p);
      }
    }
    draw(t);
  };
  return self;
};

MACHINES.beltDStub = (api) => {
  const D = api.data;
  const g = api.slot("items");
  const items = [0.25, 0.55, 0.85].map((f) => ({ item: api.item("audio"), y: D.y0 + (D.y1 - D.y0) * f }));
  return {
    accept(port, item, from) { items.push({ item, y: from ? from[1] : D.y1 }); },
    tick(dt) {
      if (!api.calm()) for (const it of items) it.y -= D.speed * dt;
      for (let i = items.length - 1; i >= 0; i--) if (items[i].y <= D.y0 + 2) { const [it] = items.splice(i, 1); api.emit("out", it.item, [D.x, it.y, D.z]); }
      g.innerHTML = items.slice().sort((a, b) => a.y - b.y).map((it) => api.packetSvg(it.item.kind, [D.x, it.y, D.z])).join("");
    },
  };
};

MACHINES.elevator = (api) => {
  const D = api.data;
  const P = api.P;
  const g = { front: api.slot("front"), back: api.slot("back"), feed: api.slot("feed"), spout: api.slot("spout") };
  const Lf = D.zh - D.zb, wrap = Math.PI * D.r, total = 2 * Lf + 2 * wrap;
  const N = D.count, spacing = total / N, PITCH = 4;
  const X0 = D.cradle.x0, X1 = D.cradle.x1, XC = (X0 + X1) / 2;
  let travel = 0;
  const cradles = Array.from({ length: N }, (_, i) => ({ i, item: null, u: 0 }));
  const feed = [];
  const waiting = [];
  const self = { lifted: 0 };
  const uOf = (i) => (((travel + i * spacing) % total) + total) % total;
  // steady state at load: every other cradle on the front run already carries a packet
  cradles.forEach((c) => { c.u = uOf(c.i); if (c.u > 20 && c.u < Lf - 10 && c.i % 2 === 0) c.item = api.item("audio"); });

  const S = (plan, z0, z1, style) => {
    const lo = Math.max(z0, D.zLow), hi = Math.min(z1, D.zHigh);
    return hi - lo > 0.05 ? solidSvg(slabOf(plan, lo, hi - lo, P, 2), style) : "";
  };
  const pl = (x0, y0, x1, y1) => ({ x: x0, y: y0, w: x1 - x0, d: y1 - y0, r: 0.2 });
  // a packet cut where it passes through the boot top or the hood bottom (and through the boot's feed face)
  function packetPart(kind, x, y, z, { w = 9.2, d = 8, h = 7, yMin = -1e9, zMin = D.zLow, zMax = D.zHigh } = {}) {
    const lo = Math.max(z, zMin), hi = Math.min(z + h, zMax);
    const y0 = Math.max(y - d / 2, yMin);
    if (hi - lo < 0.05 || y + d / 2 - y0 < 0.05) return "";
    const whole = lo === z && hi === z + h && y0 === y - d / 2;
    if (whole) return api.packetSvg(kind, [x, y, z], { w, d, h });
    return '<g class="pk" data-kind="' + kind + '">' + solidSvg(slabOf({ x: x - w / 2, y: y0, w, d: y + d / 2 - y0, r: 0.6 }, lo, hi - lo, P, 2, 0.3), { tone: "hi" }) + '</g>';
  }
  function frontCradle(zc, item) {
    const YS = D.yf + 0.7;
    let s = '<g class="it">';
    s += S(pl(X0, YS, X1, YS + 1.2), zc + 1.2, zc + 10, { tone: "mid" });
    s += S(pl(X0, YS + 1.2, X0 + 0.8, YS + 8.3), zc + 1.2, zc + 4, { tone: "mid" });
    s += S(pl(X0, YS, X1, YS + 10.5), zc, zc + 1.2, { tone: "mid" });
    s += '</g>';
    if (item) s += packetPart(item.kind, XC, YS + 5.2, zc + 1.2);
    s += '<g class="it">' + S(pl(X1 - 0.8, YS + 1.2, X1, YS + 8.3), zc + 1.2, zc + 4, { tone: "mid" }) + S(pl(X0, YS + 9.3, X1, YS + 10.5), zc + 1.2, zc + 3, { tone: "mid" }) + '</g>';
    return s;
  }
  function backCradle(zc) {
    const YS = D.yb - 0.7;
    let s = '<g class="it">';
    s += S(pl(X0, YS - 10.5, X1, YS - 9.3), zc - 3, zc - 1.2, { tone: "mid" });
    s += S(pl(X0, YS - 9.3, X0 + 0.8, YS - 1.2), zc - 4, zc - 1.2, { tone: "mid" });
    s += S(pl(X0, YS - 1.2, X1, YS), zc - 10, zc - 1.2, { tone: "mid" });
    s += S(pl(X1 - 0.8, YS - 9.3, X1, YS - 1.2), zc - 4, zc - 1.2, { tone: "mid" });
    s += S(pl(X0, YS - 10.5, X1, YS), zc - 1.2, zc, { tone: "mid" });
    return s + '</g>';
  }
  // a prism along x of a convex (y, z) polygon, shaded by the kit's rules: cradles while they round the head sprocket
  const VW = G.viewOf(P), CAM = cameraOf(P), LX = -CAM.sinA, LY = CAM.cosA;
  function hull(points) {
    const pts = points.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lo = [], up = [];
    for (const p of pts) { while (lo.length > 1 && cross(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop(); lo.push(p); }
    for (const p of pts.reverse()) { while (up.length > 1 && cross(up[up.length - 2], up[up.length - 1], p) <= 0) up.pop(); up.push(p); }
    return lo.slice(0, -1).concat(up.slice(0, -1));
  }
  const dpath = (pts) => "M" + pts.map(([x, y]) => x.toFixed(2) + " " + y.toFixed(2)).join("L") + "Z";
  function xprism(x0, x1, poly) {
    const cy = poly.reduce((a, p) => a + p[0], 0) / poly.length, cz = poly.reduce((a, p) => a + p[1], 0) / poly.length;
    const all = [], shades = [[], [], [], []], tops = [];
    const put = (nrm, quad) => {
      if (nrm[0] * VW[0] + nrm[1] * VW[1] + nrm[2] * VW[2] <= 1e-6) return;
      const d = dpath(quad.map((p) => iso(p, P)));
      if (nrm[2] > 0.7) { tops.push(d); return; }
      const h = Math.hypot(nrm[0], nrm[1]) || 1;
      const lit = ((nrm[0] / h) * LX + (nrm[1] / h) * LY + 1) / 2;
      shades[Math.min(3, Math.max(0, Math.floor(lit * 4)))].push(d);
    };
    put([1, 0, 0], poly.map(([y, z]) => [x1, y, z]));
    poly.forEach((a, i) => {
      const b = poly[(i + 1) % poly.length];
      let ny = b[1] - a[1], nz = -(b[0] - a[0]);
      const len = Math.hypot(ny, nz) || 1; ny /= len; nz /= len;
      if (ny * ((a[0] + b[0]) / 2 - cy) + nz * ((a[1] + b[1]) / 2 - cz) < 0) { ny = -ny; nz = -nz; }
      put([0, ny, nz], [[x0, a[0], a[1]], [x0, b[0], b[1]], [x1, b[0], b[1]], [x1, a[0], a[1]]]);
    });
    poly.forEach(([y, z]) => { all.push(iso([x0, y, z], P), iso([x1, y, z], P)); });
    const outline = dpath(hull(all));
    let svg = '<g class="iso-solid"><path class="iso-fill" d="' + outline + '"/>';
    shades.forEach((list, i) => { if (list.length) svg += '<path class="iso-shade" data-shade="' + i + '" d="' + list.join("") + '"/>'; });
    if (tops.length) svg += '<path class="iso-top" d="' + tops.join("") + '"/>';
    return svg + '<path class="iso-line iso-edge" data-tone="mid" d="' + outline + '"/></g>';
  }
  function wrapCradle(phi) {
    const c = Math.cos(phi), sn = Math.sin(phi);
    const Cy = D.yc + D.r * c, Cz = D.zh + D.r * sn;
    const yz = (nn, tt) => [Cy + c * nn - sn * tt, Cz + sn * nn + c * tt];
    const parts = [[X0, X1, 0.7, 1.9, 1.2, 10], [X0, X0 + 0.8, 1.9, 9, 1.2, 4], [X0, X1, 0.7, 11.2, 0, 1.2], [X1 - 0.8, X1, 1.9, 9, 1.2, 4], [X0, X1, 10, 11.2, 1.2, 3]];
    return '<g class="it">' + parts.map(([a, b, n0, n1, t0, t1]) => {
      const poly = [yz(n0, t0), yz(n1, t0), yz(n1, t1), yz(n0, t1)];
      const m = yz((n0 + n1) / 2, (t0 + t1) / 2);
      return { k: ((a + b) / 2) * VW[0] + m[0] * VW[1] + m[1] * VW[2], svg: xprism(a, b, poly) };
    }).sort((p, q) => p.k - q.k).map((p) => p.svg).join("") + '</g>';
  }
  const flights = [];
  const FLY = 0.75, DUCT = 0.5, EMERGE = 0.3;
  function pins(y, dir) {
    const ph = ((travel % PITCH) + PITCH) % PITCH;
    const pts = [];
    for (const x of D.strands) {
      for (let z = D.zLow + (dir > 0 ? ph : PITCH - ph); z < D.zh - 0.4; z += PITCH) pts.push(iso([x + 0.6, y, z], P));
    }
    return dotsSvg(pts, { size: 0.36, tone: "hi" });
  }
  self.accept = (port, item, from) => {
    feed.push({ item, x: from ? from[0] : D.feed.x, y: from ? from[1] : D.feed.mouth, x0: from ? from[0] : D.feed.x, t0: api.now() });
  };
  self.tick = (dt, t) => {
    const step = api.calm() ? 0 : D.speed * dt;
    // cradles
    for (const c of cradles) {
      const before = c.u;
      const after = (((before + step) % total) + total) % total;
      if (after < before && waiting.length && !c.item) c.item = waiting.shift();
      const launch = Lf;
      if (before < launch && after >= launch && c.item) {
        flights.push({ item: c.item, t0: t, from: [XC, D.yf + 5.9, D.zh + 1.2] });
        c.item = null;
      }
      c.u = after;
    }
    travel += step;
    // feed: slide from the belt end down the chute and in through the feed opening
    for (let i = feed.length - 1; i >= 0; i--) {
      const f = feed[i];
      if (!api.calm()) f.y -= 22 * dt;
      f.x = D.feed.x + (f.x0 - D.feed.x) * Math.exp(-(t - f.t0) / 0.15);
      if (f.y < D.feed.face - 4.2) { waiting.push(f.item); feed.splice(i, 1); }
    }
    let front = pins(D.yf, 1), back = pins(D.yb, -1);
    // chain wrapped round the head sprocket: short link segments and their pins, split front / back like the cradles
    const ph = ((travel % PITCH) + PITCH) % PITCH;
    let backChain = "";
    for (const x of D.strands) {
      const SEG = 16;
      for (let i = 0; i < SEG; i++) {
        const f0 = (i / SEG) * Math.PI, f1 = ((i + 1) / SEG) * Math.PI;
        const q = [[D.r - 0.7, f0], [D.r + 0.7, f0], [D.r + 0.7, f1], [D.r - 0.7, f1]].map(([rr, f]) => [D.yc + rr * Math.cos(f), D.zh + rr * Math.sin(f)]);
        const svg = '<g class="it">' + xprism(x - 0.6, x + 0.6, q).replace('data-tone="mid"', 'data-tone="lo"') + '</g>';
        if ((f0 + f1) / 2 < 2.255) front += svg; else backChain += svg;
      }
      const pts = [], ptsB = [];
      for (let sArc = ph; sArc < Math.PI * D.r; sArc += PITCH) {
        const f = sArc / D.r, pt = iso([x + 0.6, D.yc + D.r * Math.cos(f), D.zh + D.r * Math.sin(f)], P);
        (f < 2.255 ? pts : ptsB).push(pt);
      }
      front += dotsSvg(pts, { size: 0.36, tone: "hi" });
      backChain += dotsSvg(ptsB, { size: 0.36, tone: "hi" });
    }
    const order = cradles.slice().sort((a, b) => a.u - b.u);
    for (const c of order) {
      if (c.u < Lf) front += frontCradle(D.zb + c.u, c.item);
      else if (c.u <= Lf + wrap) { const phi = (c.u - Lf) / D.r; if (phi < 2.255) front += wrapCradle(phi); else back += wrapCradle(phi); }
      else if (c.u < 2 * Lf + wrap) back += backCradle(D.zh - (c.u - Lf - wrap));
    }
    let spout = "";
    // packets flung from the cradles as they round the sprocket, over into the discharge hopper (cut at its rim);
    // after the duct's transit time they leave the down-spout at the out port
    for (let i = flights.length - 1; i >= 0; i--) {
      const f = flights[i];
      const s = api.clamp((t - f.t0) / FLY, 0, 1), e = s * s * (3 - 2 * s) * 0.35 + s * 0.65, u = 1 - e;
      const P1 = [XC, D.yc + 1, D.zh + 40], P2 = D.hopper.land;
      const p = [0, 1, 2].map((j) => u * u * f.from[j] + 2 * u * e * P1[j] + e * e * P2[j]);
      const age = t - f.t0 - FLY - DUCT;
      if (age >= EMERGE) {
        flights.splice(i, 1);
        self.lifted++;
        api.emit("out", f.item, [D.ports.out[0], D.ports.out[1], D.ports.out[2] - 7]);
        continue;
      }
      if (s < 1) front += packetPart(f.item.kind, p[0], p[1], p[2], { zMin: p[1] < D.hopper.edge ? D.hopper.rim : -1e9 });
      else if (age > 0) {
        const k2 = age / EMERGE;
        spout += packetPart(f.item.kind, D.ports.out[0], D.ports.out[1], D.ports.out[2] - 7 * k2 * k2, { zMin: -1e9, zMax: D.ports.out[2] });
      }
    }
    g.front.innerHTML = front;
    g.back.innerHTML = back + backChain;
    g.feed.innerHTML = feed.map((f) => packetPart(f.item.kind, f.x, f.y, D.feed.z, { w: 10, yMin: D.feed.face, zMin: -1e9 })).join("");
    g.spout.innerHTML = spout;
  };
  return self;
};

MACHINES.speakerStub = (api) => {
  const D = api.data;
  const g = api.slot("cap");
  let hitAt = -9;
  const falling = [];
  const RIM = D.cap[2] - 1.6;
  // a packet's visible part above the cone (it drops into the cone and is cut there)
  const part = (kind, [x, y, z]) => {
    const lo = Math.max(z, RIM), hi = z + 7;
    if (hi - lo < 0.05) return "";
    return '<g class="pk" data-kind="' + kind + '">' + solidSvg(slabOf({ x: x - 4.6, y: y - 4, w: 9.2, d: 8, r: 0.6 }, lo, hi - lo, api.P, 2, 0.3), { tone: "hi" }) + '</g>';
  };
  const self = {
    received: 0,
    // falls from the spout (`from` = packet bottom centre) under gravity into the cone; the dust cap pumps on landing
    accept(port, item, from) { falling.push({ item, t0: api.now(), from: from || [D.cap[0], D.cap[1], D.cap[2] + 10] }); },
    tick(dt, t) {
      let html = "";
      for (let i = falling.length - 1; i >= 0; i--) {
        const f = falling[i], a = t - f.t0;
        const z = f.from[2] - 0.5 * 160 * a * a - 7 * 0.6 * a;
        if (z + 7 < RIM) { falling.splice(i, 1); self.received++; hitAt = t; continue; }
        html += part(f.item.kind, [f.from[0], f.from[1], z]);
      }
      const age = t - hitAt;
      const push = api.calm() ? 0 : api.smooth(0, 0.06, age) * Math.exp(-Math.max(0, age - 0.06) / 0.22) * 0.9;
      const F = G.frameOf([D.cap[0], D.cap[1], D.cap[2] - 0.6 + push], [0, 0, 1], [1, 0, 0], [0, 1, 0]);
      g.innerHTML = '<g class="it fx-graphite">' + solidSvg(G.solidOf([[0, 4.2], [0.4, 4.2, 1], [1.1, 3.4, 1], [1.6, 2.1, 1], [1.8, 0]], F, api.P), { tone: "mid" }) + '</g>' + html;
    },
  };
  return self;
};

FACTORY.define("audio", MACHINES.conveyor);
FACTORY.feed("audio", "in", 2.2, () => FACTORY.item(["control", "graph", "data"][Math.floor(Math.random() * 3)]), 0.3);
FACTORY.define("scanner", MACHINES.scanner);
FACTORY.define("beltD", MACHINES.beltDStub);
FACTORY.define("elevator", MACHINES.elevator);
FACTORY.define("speaker", MACHINES.speakerStub);
FACTORY.link("scanner", "out", "beltD", "in");

FACTORY.link("elevator", "out", "speaker", "in");
FACTORY.readout(() => {
  const s = FACTORY.machines.scanner, e = FACTORY.machines.elevator;
